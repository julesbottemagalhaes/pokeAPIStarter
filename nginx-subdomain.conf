# ==============================================================================
# Configuration Nginx pour le sous-domaine : pokedex.votre-domaine.com
# ==============================================================================
# Remplacez "pokedex.votre-domaine.com" par votre sous-domaine réel
# et "/var/www/pokedex" par le chemin absolu vers les fichiers sur votre serveur.

# 1. Redirection HTTP vers HTTPS (Let's Encrypt / Sécurité)
server {
    listen 80;
    listen [::]:80;
    server_name pokedex.votre-domaine.com;

    # Défi Certbot pour renouvellement SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pokedex.votre-domaine.com;

    # Certificats SSL (générés par exemple avec : certbot --nginx -d pokedex.votre-domaine.com)
    # ssl_certificate /etc/letsencrypt/live/pokedex.votre-domaine.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pokedex.votre-domaine.com/privkey.pem;

    # Protocoles et chiffrements modernes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Dossier racine du projet Pokédex
    root /var/www/pokedex;
    index index.html;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Cache des fichiers statiques (CSS, JS, Webmanifest, images)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|webmanifest)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Redirection propre pour les routes / index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
